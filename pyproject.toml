[project]
name = "fermata-timer"
version = "0.6.0"
description = "Fermata — focus timer with scenarios"
readme = "README.md"
license = "GPL-3.0-only"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = [
    "ttkbootstrap>=2.2.4",
]

[dependency-groups]
dev = [
    "pyinstaller>=6.22.3",
    "pytest>=9.1.1",
]

[project.scripts]
fermata = "fermata.app:main"

[build-system]
requires = ["uv_build>=0.11.6,<0.12.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "fermata"  # the project is fermata-timer: fermata is taken on PyPI

